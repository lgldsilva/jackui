# Reproduces the Sonar new-code gate LOCALLY before pushing (a CI cycle costs
# ~12min). Documented usage (docs/CICD.md → "Running the gates locally"):
#
#   golangci-lint run --new-from-rev=gitea/main ./...
#
# --new-from-rev only reports the lines in YOUR diff (mirrors Sonar's "new code",
# with no false positives from pre-existing code). Not run in the pipeline — CI
# covers gofmt/vet and Sonar enforces S3776 on main.
version: "2"
run:
  tests: false
linters:
  default: none
  enable:
    - gocognit
    - gocritic
    - staticcheck
  settings:
    gocognit:
      # >15 is what Sonar (S3776) flags in new code.
      min-complexity: 16
