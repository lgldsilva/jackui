# JackUI data-flow barriers for CodeQL (data extensions).
#
# Each entry below declares a function that IS already a real security
# barrier in the code — CodeQL simply does not recognize its own functions as
# sanitizers. The project rule forbids finding suppression (#nosec &c.);
# this file suppresses nothing: it teaches the scanner where a real
# validation already happens, so that a closed finding means "validated", and a
# finding that survives means "a real guard is missing".
#
# Maintenance contract: EVERY function listed here has a unit test
# proving the guarantee (see the corresponding *_test.go files). If the function
# changes semantics, the test breaks before the model becomes a lie.
#
# Note: the Go log-injection query (CWE-117) does NOT consume barriers with kind —
# its sanitizers are typed classes (strings.ReplaceAll on the very
# argument, or an operand of %q). Logs with external input use %q in the verb;
# log barriers cannot be modeled here.
extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: barrierModel
    data:
      # ── path-injection: path validation inside the mount ──
      - ["github.com/lgldsilva/jackui/internal/handlers/httpshared", "", True, "SanitizeSubdir", "", "", "ReturnValue", "path-injection", "manual"]
      - ["github.com/lgldsilva/jackui/internal/local", "Browser", True, "ResolvePath", "", "", "ReturnValue", "path-injection", "manual"]
      - ["github.com/lgldsilva/jackui/internal/local", "Browser", True, "ResolvePathFor", "", "", "ReturnValue", "path-injection", "manual"]
      - ["github.com/lgldsilva/jackui/internal/handlers/local", "", True, "sanitizeSidecarName", "", "", "ReturnValue", "path-injection", "manual"]
      - ["github.com/lgldsilva/jackui/internal/handlers/local", "", True, "sanitizeRenameName", "", "", "ReturnValue", "path-injection", "manual"]
      - ["github.com/lgldsilva/jackui/internal/handlers/local", "", True, "clampPromoteDst", "", "", "ReturnValue", "path-injection", "manual"]
      - ["github.com/lgldsilva/jackui/internal/transcode", "HLSSessionManager", True, "sessionDir", "", "", "ReturnValue", "path-injection", "manual"]
      # ── request-forgery: proxy URL validated against the Jackett ──
      - ["github.com/lgldsilva/jackui/internal/handlers", "", True, "sanitizeJackettURL", "", "", "ReturnValue", "request-forgery", "manual"]
