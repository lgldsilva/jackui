name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jackui_test
          POSTGRES_USER: jackui
          POSTGRES_PASSWORD: jackui_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JACKUI_TEST_DATABASE_URL: postgres://jackui:jackui_test@localhost:5433/jackui_test?sslmode=disable

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./internal/...

      - name: go test
        run: go test -p 4 -timeout 20m -coverprofile=coverage.out ./internal/...

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: hashFiles('coverage.out') != ''
        with:
          name: coverage-out
          path: coverage.out

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.out') != ''
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: npm run lint

      - name: check i18n
        run: npm run check:i18n

      - name: test
        run: npm test

      - name: build
        run: npm run build

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        run: |
          mkdir -p ui/dist && printf '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>p</title></head><body></body></html>\n' > ui/dist/index.html
          # go run @vX consults a phantom v2.13.0 on sum.golang.org (404). Fetch the
          # pinned GitHub release tarball and verify its checksum instead of curl|sh.
          curl -sSfL -o /tmp/golangci.tgz \
            https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz
          echo "8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553  /tmp/golangci.tgz" | sha256sum -c
          tar -C /tmp -xzf /tmp/golangci.tgz
          /tmp/golangci-lint-2.12.2-linux-amd64/golangci-lint run --new-from-rev=origin/main ./...

  # SonarCloud (sonarcloud.io) — cloud analysis that works from GitHub-hosted
  # runners (the homelab SonarQube is LAN-only; pattern modelled on ai-launcher).
  # Needs the SONAR_TOKEN secret; organization/project key come from repo
  # variables with the defaults below. Every step skips cleanly until the
  # secret exists, so forks and early setup stay green.
  #
  # SONAR_TOKEN is scoped to this job only. The scanner package is pinned to an
  # exact version so a newly published npm tag cannot run with the secret.
  # Coverage is reused from the backend job's artifact — no duplicate test run.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: backend
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'lgldsilva' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'lgldsilva_jackui' }}
      # `secrets` is not available in step `if:` conditions, so the token is
      # bound at the job level and the steps gate on `env.SONAR_TOKEN` instead.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0 # full history for accurate new-code detection
      - name: Download coverage (from backend job)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: coverage-out
      # Official SonarSource action pinned by SHA (an npx install trips the
      # githubactions:S6505 supply-chain rule and fails the new-security gate).
      - name: SonarCloud analysis (waits for the quality gate)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
      - name: SonarCloud skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN not set — skipping SonarCloud analysis."
