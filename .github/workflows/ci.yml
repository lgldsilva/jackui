name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm-ci:
    name: ARM CI stack
    # PR code is always evaluated on GitHub-hosted ARM with the default Docker
    # context. Repository topology overrides are only accepted on trusted
    # push/workflow_call events.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04-arm' || fromJSON(vars.JACKUI_CI_RUNNER_LABELS || '["ubuntu-24.04-arm"]') }}
    env:
      JACKUI_CI_DOCKER_CONTEXT: ${{ github.event_name == 'pull_request' && 'default' || vars.JACKUI_CI_DOCKER_CONTEXT || 'default' }}
      JACKUI_CI_COMPOSE_PROJECT: ${{ vars.JACKUI_CI_COMPOSE_PROJECT || 'jackui-ci' }}
      JACKUI_CI_RUNNER_LABELS: ${{ github.event_name == 'pull_request' && '["ubuntu-24.04-arm"]' || vars.JACKUI_CI_RUNNER_LABELS || '["ubuntu-24.04-arm"]' }}
      JACKUI_CI_IMAGE: ${{ vars.JACKUI_CI_IMAGE || 'jackui-ci:local' }}
      JACKUI_CI_POSTGRES_PORT: ${{ github.event_name == 'pull_request' && '0' || vars.JACKUI_CI_POSTGRES_PORT || '0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner and Docker architecture
        run: |
          test "$(uname -m)" = aarch64 -o "$(uname -m)" = arm64
          test "$(docker --context "$JACKUI_CI_DOCKER_CONTEXT" version --format '{{.Server.Arch}}')" = arm64

      - name: Run the canonical disposable CI stack
        run: |
          scripts/ci-arm_test.sh
          mkdir -p -- "$CI_ARTIFACT_DIR"
          scripts/ci-arm.sh all
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/jackui-ci-artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jackui-ci-artifacts
          path: ${{ runner.temp }}/jackui-ci-artifacts
          if-no-files-found: warn

  # Dependency scanning gate (issue #80): the release pipeline only scans the
  # final image for CRITICAL, so HIGH CVEs in go.mod/package-lock.json entered
  # via PR unchecked. Runs on ubuntu-latest in parallel with arm-ci for fast
  # feedback. Baseline scan was clean on HIGH,CRITICAL, so the gate fails on
  # both severities.
  depscan:
    name: Dependency scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: node_modules

  # SonarCloud is intentionally separate from ARM execution because it consumes
  # the immutable coverage artifact and performs no build or test work.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: arm-ci
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'lgldsilva' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'lgldsilva_jackui' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download ARM coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jackui-ci-artifacts
          path: artifacts

      - name: SonarCloud analysis (waits for the quality gate)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.go.coverage.reportPaths=artifacts/coverage.out
            -Dsonar.javascript.lcov.reportPaths=artifacts/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: SonarCloud skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN not set — skipping SonarCloud analysis."

  # Go microbenchmarks. INFORMATIONAL: shared runners are too noisy for a
  # perf gate, so the job never fails on a regression — it fails only when a
  # benchmark stops compiling or panics. On a PR it also runs the merge base
  # and publishes a benchstat delta, which is the number worth reading.
  bench:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Discover benchmarked packages
        id: pkgs
        run: |
          pkgs=$(grep -rl '^func Benchmark' --include='*_test.go' . \
            | xargs -r -n1 dirname | sed 's|^\./||' | sort -u | sed 's|^|./|' | tr '\n' ' ')
          echo "list=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Benchmarked packages: ${pkgs:-<none>}"

      - name: Benchmark this revision
        if: steps.pkgs.outputs.list != ''
        env:
          PKGS: ${{ steps.pkgs.outputs.list }}
        run: |
          # shellcheck disable=SC2086 -- PKGS is a space-separated package list
          go test -run '^$' -bench . -benchmem -count 6 $PKGS | tee new.txt

      # Same code, same runner, same minute — the only honest baseline for a
      # number produced on shared hardware.
      - name: Benchmark the merge base
        if: github.event_name == 'pull_request' && steps.pkgs.outputs.list != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # checkout gives us the PR merge ref; the base branch may not exist
          # as a remote-tracking ref yet.
          git fetch --no-tags --quiet origin \
            "$BASE_REF:refs/remotes/origin/$BASE_REF" 2>/dev/null || true
          base=$(git merge-base HEAD "origin/$BASE_REF")
          echo "merge base: $base"
          git worktree add /tmp/bench-base "$base"
          cd /tmp/bench-base
          # Packages are resolved against the base tree: a benchmark added by
          # this PR simply has no baseline, and benchstat says so.
          pkgs=$(grep -rl '^func Benchmark' --include='*_test.go' . \
            | xargs -r -n1 dirname | sed 's|^\./||' | sort -u | sed 's|^|./|' | tr '\n' ' ')
          [ -n "$pkgs" ] || { echo "no benchmarks at the base"; exit 0; }
          go test -run '^$' -bench . -benchmem -count 6 $pkgs \
            | tee "$GITHUB_WORKSPACE/old.txt"

      - name: Publish results
        if: always() && steps.pkgs.outputs.list != ''
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260819171926-ebcb4798430d
          {
            echo '## Benchmarks'
            echo
            if [ -s old.txt ] && [ -s new.txt ]; then
              echo 'Merge base vs. this PR (informational — shared runners are noisy):'
              echo '```'
              # A benchmark added by this PR has no baseline; benchstat treats a
              # mismatched set as an error, so never let it sink the summary.
              benchstat old.txt new.txt || echo '(benchstat failed — raw output is in the artifact)'
              echo '```'
            elif [ -s new.txt ]; then
              echo '```'
              benchstat new.txt
              echo '```'
            else
              echo 'No benchmark output was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark output
        if: always() && steps.pkgs.outputs.list != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jackui-benchmarks
          path: |
            new.txt
            old.txt
          if-no-files-found: ignore
          retention-days: 14
