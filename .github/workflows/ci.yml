name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm-ci:
    name: ARM CI stack
    # PR code is always evaluated on GitHub-hosted ARM with the default Docker
    # context. Repository topology overrides are only accepted on trusted
    # push/workflow_call events.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04-arm' || fromJSON(vars.JACKUI_CI_RUNNER_LABELS || '["ubuntu-24.04-arm"]') }}
    env:
      JACKUI_CI_DOCKER_CONTEXT: ${{ github.event_name == 'pull_request' && 'default' || vars.JACKUI_CI_DOCKER_CONTEXT || 'default' }}
      JACKUI_CI_COMPOSE_PROJECT: ${{ vars.JACKUI_CI_COMPOSE_PROJECT || 'jackui-ci' }}
      JACKUI_CI_RUNNER_LABELS: ${{ github.event_name == 'pull_request' && '["ubuntu-24.04-arm"]' || vars.JACKUI_CI_RUNNER_LABELS || '["ubuntu-24.04-arm"]' }}
      JACKUI_CI_IMAGE: ${{ vars.JACKUI_CI_IMAGE || 'jackui-ci:local' }}
      JACKUI_CI_POSTGRES_PORT: ${{ github.event_name == 'pull_request' && '0' || vars.JACKUI_CI_POSTGRES_PORT || '0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner and Docker architecture
        run: |
          test "$(uname -m)" = aarch64 -o "$(uname -m)" = arm64
          test "$(docker --context "$JACKUI_CI_DOCKER_CONTEXT" version --format '{{.Server.Arch}}')" = arm64

      - name: Run the canonical disposable CI stack
        run: |
          scripts/ci-arm_test.sh
          mkdir -p -- "$CI_ARTIFACT_DIR"
          scripts/ci-arm.sh all
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/jackui-ci-artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jackui-ci-artifacts
          path: ${{ runner.temp }}/jackui-ci-artifacts
          if-no-files-found: warn

  # SonarCloud is intentionally separate from ARM execution because it consumes
  # the immutable coverage artifact and performs no build or test work.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: arm-ci
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'lgldsilva' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'lgldsilva_jackui' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download ARM coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jackui-ci-artifacts
          path: artifacts

      - name: SonarCloud analysis (waits for the quality gate)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.go.coverage.reportPaths=artifacts/coverage.out
            -Dsonar.javascript.lcov.reportPaths=artifacts/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: SonarCloud skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN not set — skipping SonarCloud analysis."
