# SonarCloud (sonarcloud.io) — analysis runs in GitHub Actions (the `sonar`
# job in .github/workflows/ci.yml). Host, organization, project key and token
# are passed as -D flags by CI; never hardcode them here. The Makefile
# `sonar-scan` target uses the SAME file against the homelab SonarQube for
# local previews (it supplies its own host/token/projectKey flags).
# Local run:
#   make sonar-scan   (homelab SonarQube)

sonar.sources=.
sonar.exclusions=docs/archive/**,**/node_modules/**,**/dist/**,**/ui/dist/**,**/*.cov,**/vendor/**,electron/**,**/streamer/streams/**,**/eslint.config.mjs
sonar.tests=.
sonar.test.inclusions=**/*_test.go,web/**/*.test.ts,web/**/*.test.tsx,web/**/*.spec.ts,web/**/*.spec.tsx
sonar.go.coverage.reportPaths=coverage.out

# The REAL gate: the scanner waits for the quality-gate verdict and exits !=0 if it fails.
# (It was only a flag in CI at some point and got lost — without this the stage is falsely green.)
sonar.qualitygate.wait=true

# Outside the coverage metric:
#  - web/src now HAS a harness (vitest + lcov, gate P1.2a): it stays inside the
#    metric; only non-app-logic leaves it (config, test setup,
#    service worker and static assets of web/public).
#  - cmd/**: main.go is only wiring (Gin routes + workers), covered by E2E/manual.
#  - electron/**: desktop wrapper, no unit tests.
# Otherwise the quality gate's new_coverage condition becomes unrealistic.
sonar.coverage.exclusions=web/public/**,web/*.config.*,web/src/test-setup.ts,cmd/**,electron/**

# Documented exceptions (team pattern: every smell exception needs a justification).
# S6847/S6848: the modals use <dialog> as a backdrop with onClick (close on outside
# click) + onKeyDown (Escape). It is an intentional, accessible modal pattern (focus
# trapped, Escape closes); the jsx-a11y rule does not recognize <dialog> as interactive.
# The shared <ModalShell> (previously a follow-up) now exists: web/src/components/Sheet.tsx.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6847
sonar.issue.ignore.multicriteria.e1.resourceKey=web/src/**/*.tsx
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.e2.resourceKey=web/src/**/*.tsx
# S3776 (cognitive complexity) does not apply to test files: case tables and
# setups naturally branch more than production code.
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*_test.go
# S6819: the Sheet (ModalShell) intentionally uses <div role="dialog"> — the native
# <dialog> reintroduces the user-agent width:fit-content quirk (documented in the
# code), and the component already provides backdrop, focus trap and Escape-to-close.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e4.resourceKey=web/src/**/*.tsx
# SHA-1 in these files is mandated by interoperable protocols, not used for
# password/content security: BitTorrent v1 piece hashes and RFC 6238 TOTP.
sonar.issue.ignore.multicriteria.e5.ruleKey=go:S4790
sonar.issue.ignore.multicriteria.e5.resourceKey=internal/contentid/contentid.go
sonar.issue.ignore.multicriteria.e6.ruleKey=go:S4790
sonar.issue.ignore.multicriteria.e6.resourceKey=internal/auth/totp.go
# Jitter is deliberately non-cryptographic; it prevents synchronized retries.
sonar.issue.ignore.multicriteria.e7.ruleKey=go:S2245
sonar.issue.ignore.multicriteria.e7.resourceKey=internal/httpretry/httpretry.go

# S5332 (clear-text protocol): the mailer supports SMTP without TLS
# for local relays (and STARTTLS where the server offers it); clear-text is an
# intentional, deployment-configurable fallback, never used for credentials
# over an untrusted network. Accepted for the one mailer file.
sonar.issue.ignore.multicriteria.e8.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.e8.resourceKey=internal/mailer/mailer.go

# The disposable CI image deliberately runs as root: it installs build tools,
# writes only to an ephemeral container/volume, and is never shipped or served.
sonar.issue.ignore.multicriteria.e9.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e9.resourceKey=Dockerfile.ci
# golangci-lint is installed from an exact Go module version. Go's module graph
# and checksums are the lock contract; the Docker rule only recognizes npm-like
# lock-file commands and reports this exact `go install @version` as unpinned.
sonar.issue.ignore.multicriteria.e10.ruleKey=docker:S8545
sonar.issue.ignore.multicriteria.e10.resourceKey=Dockerfile.ci
# This test asserts an intentionally unreachable IPv4 loopback URL used to keep
# the smoke test independent from Jackett. No traffic or credentials leave the
# disposable CI container.
sonar.issue.ignore.multicriteria.e11.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e11.resourceKey=scripts/ci-arm_test.sh

# Same rationale as e10, in the bench job: benchstat is installed from an exact
# Go module pseudo-version, and Go's module graph + checksums are the lock
# contract. The rule only recognizes npm-like lock-file commands.
sonar.issue.ignore.multicriteria.e12.ruleKey=githubactions:S8545
sonar.issue.ignore.multicriteria.e12.resourceKey=.github/workflows/ci.yml
